<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">

<style>
  #rubyGraph,
  #rubyGraph * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  #rubyGraph [hidden] {
    display: none !important;
  }

  #rubyGraph {
    --console: #0a0e14;
    --header: #000000;
    --gutter: #737373;
    --text: #ffffff;
    --neon: #00ff00;
    --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    width: min(100%, 760px);
    margin: 24px auto 12px;
    overflow: hidden;
    border: 1px solid rgba(255, 0, 255);
    border-radius: 0px;
    background: var(--console);
    color: var(--text);
    font-family: var(--mono);
  }

  #rubyGraph.is-maximized {
    position: fixed;
    inset: 0;
    z-index: 9999;
    width: 100%;
    max-width: none;
    height: 100%;
    margin: 0;
    border: 0;
    border-radius: 0;
    display: flex;
    flex-direction: column;
  }

  #rubyGraph:fullscreen {
    width: 100%;
    max-width: none;
    height: 100%;
    margin: 0;
    border: 0;
    border-radius: 0;
    display: flex;
    flex-direction: column;
  }

  #rubyGraph:-webkit-full-screen {
    width: 100%;
    max-width: none;
    height: 100%;
    margin: 0;
    border: 0;
    border-radius: 0;
    display: flex;
    flex-direction: column;
  }

  #rubyGraph.is-maximized .ruby-graph__stage,
  #rubyGraph:fullscreen .ruby-graph__stage,
  #rubyGraph:-webkit-full-screen .ruby-graph__stage {
    flex: 1;
    height: auto;
    min-height: 0;
  }

  #rubyGraph .ruby-graph__header {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 6px 0 14px;
    background: var(--header);
    flex: none;
  }

  #rubyGraph .ruby-graph__title {
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1;
    white-space: nowrap;
  }

  #rubyGraph .ruby-graph__slider {
    width: 64px;
    height: 1px;
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    border-radius: 1px;
    outline: none;
    background: #4a4a4a;
    cursor: pointer;
    touch-action: none;
  }

  #rubyGraph .ruby-graph__slider::-webkit-slider-thumb {
    width: 10px;
    height: 10px;
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    border-radius: 50%;
    background: var(--neon);
    cursor: pointer;
  }

  #rubyGraph .ruby-graph__slider::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border: 0;
    border-radius: 50%;
    background: var(--neon);
    cursor: pointer;
  }

  #rubyGraph .ruby-graph__value {
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    min-width: 14px;
    text-align: center;
  }

  #rubyGraph .ruby-graph__header-actions {
    display: flex;
    align-items: center;
    margin-left: auto;
  }

  #rubyGraph .ruby-graph__button {
    display: grid;
    width: 28px;
    height: 28px;
    place-items: center;
    border: 0;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    transition: background 150ms ease;
  }

  #rubyGraph .ruby-graph__button:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  #rubyGraph .ruby-graph__button:active {
    background: rgba(255, 255, 255, 0.14);
  }

  #rubyGraph .ruby-graph__button svg {
    display: block;
    width: 14px;
    height: 14px;
    color: var(--text);
    pointer-events: none;
  }

  #rubyGraph .ruby-graph__button:hover svg {
    color: var(--neon);
  }

  #rubyGraph .ruby-graph__button:focus-visible {
    outline: 2px solid var(--gutter);
    outline-offset: 2px;
  }

  #rubyGraph .ruby-graph__stage {
    position: relative;
    width: 100%;
    height: clamp(320px, 70vw, 560px);
    background-color: var(--console);
    background-image:
      radial-gradient(120% 90% at 12% 8%, rgba(255, 46, 136, 0.13), transparent 55%),
      radial-gradient(120% 90% at 88% 92%, rgba(0, 208, 255, 0.13), transparent 55%),
      radial-gradient(80% 70% at 50% 50%, rgba(124, 92, 255, 0.06), transparent 62%);
    touch-action: none;
    overscroll-behavior: contain;
    transform: translateZ(0);
  }

  #rubyGraph .ruby-graph__network {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #rubyGraph canvas {
    display: block;
    touch-action: none;
  }

  @media (max-width: 480px) {
    #rubyGraph {
      margin-top: 18px;
    }

    #rubyGraph .ruby-graph__header {
      padding: 0 4px 0 12px;
    }

    #rubyGraph .ruby-graph__stage {
      height: 390px;
    }

    #rubyGraph.is-maximized .ruby-graph__stage,
    #rubyGraph:fullscreen .ruby-graph__stage,
    #rubyGraph:-webkit-full-screen .ruby-graph__stage {
      height: auto;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #rubyGraph .ruby-graph__button {
      transition: none;
    }
  }
</style>

<section id="rubyGraph" aria-label="Интерактивный граф навигации">
  <header class="ruby-graph__header">
    <h2 class="ruby-graph__title">navigation</h2>

    <input
      class="ruby-graph__slider"
      id="rubyGraphDepth"
      type="range"
      min="1"
      max="6"
      value="1"
    >
    <output class="ruby-graph__value" id="rubyGraphDepthValue" for="rubyGraphDepth">2</output>

    <div class="ruby-graph__header-actions">
      <button
        class="ruby-graph__button"
        type="button"
        id="rubyGraphCenter"
        title="Центрировать граф"
        aria-label="Центрировать граф"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3.5 12h17M12 3c2.5 2.5 3.7 5.5 3.7 9S14.5 18.5 12 21M12 3c-2.5 2.5-3.7 5.5-3.7 9S9.5 18.5 12 21"></path>
        </svg>
      </button>

      <button
        class="ruby-graph__button"
        type="button"
        id="rubyGraphFullscreen"
        title="На весь экран"
        aria-label="На весь экран"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="ruby-graph__stage">
    <div class="ruby-graph__network" id="rubyGraphNetwork"></div>
  </div>
</section>

<script>
  (() => {
    "use strict";

    const VIS_URL = "https://cdn.jsdelivr.net/npm/vis-network@10.1.5/standalone/umd/vis-network.min.js";
    const CENTER_ID = 0;
    const NODE_SIZE = 10;
    const CENTER_SIZE = NODE_SIZE;
    const NODE_FONT = {
      face: "Inter, system-ui, sans-serif",
      size: 12,
      color: "#d8e2ee",
      strokeWidth: 3,
      strokeColor: "#0a0e14"
    };
    const CENTER_LINK_URL = "https://www.themoviedb.org/review/6ace164b797f07450ce77e31";
    const CENTER_IMAGE_URL = "https://image.tmdb.org/t/p/w342/rsi7YM9D4ny5HhcSMG1c724jmsk.jpg";
    const IMAGE_TIMEOUT_MS = 4000;
    const FIT_DELAY_MS = 160;
    const SETTLE_DELAY_MS = 420;
    const RESIZE_DELAY_MS = 120;

    const PERL_PALETTE = [
      "#ff2e88",
      "#00ff9c",
      "#00d0ff",
      "#ffd23f",
      "#7c5cff",
      "#ff5c57",
      "#ff9e64",
      "#4d9fff"
    ];

    const LABELS = [
      "голосования", "двенадцатый", "аксель",
      "вдругорядь", "якорь", "Мальборо",
      "османской", "заиндевевшей", "амфимерной",
      "зело", "считывает", "финтифант",
      "либидостимулирующий", "сандал", "каждения",
      "оскароносный", "олигархически", "посверкивающего",
      "мыши", "мебелировки", "результатов",
      "буханка", "дефибриллируют", "мандельштамовку",
      "рамки", "с", "хоккеистом",
      "на", "закате", "мазутоподогреватель",
      "кунжута", "разрыва", "жгуче",
      "роман", "цзяолиньпао", "чуфанит",
      "постный", "блюмс", "прыжок",
      "невероятно", "мефитическая", "еликожды",
      "плесневели", "меж", "оттого",
      "неукоснительно", "по", "принятии",
      "двумстам", "блока", "гальванизирует",
      "бифштекс", "между", "метадискурсом",
      "брандахлыстка", "отнюдь", "типа",
      "всемилостиво", "санкюлотизирует", "она",
      "пока", "инфракрасный", "луч",
      "одна", "понуждаема", "прокладками",
      "головки", "охохошеньки", "карьеры",
      "презервативно", "краснотаблеточный", "дул",
      "обувь", "от", "McDonald's",
      "цилиндров", "герцог", "выглядеть",
      "призарделася", "дноуглубительная", "смузи",
      "которого", "продавец", "ветер",
      "старинной", "из", "факта",
      "виясь", "глазастую", "эдакая",
      "фиалкокудрыя", "штревели", "кабы",
      "пемзы", "менее", "накануне",
      "цельноламельный", "гранпасьянс", "развёрстость"
    ];

    const EDGE_PAIRS = [
      [1,0],[2,0],[4,3],[5,4],[4,0],[7,6],[8,7],[7,0],
      [10,9],[11,10],[10,0],[13,12],[14,13],[13,4],
      [16,15],[17,16],[16,4],[19,18],[20,19],[19,4],
      [22,21],[23,22],[22,7],[25,24],[26,25],[25,7],
      [28,27],[29,28],[28,7],[31,30],[32,31],[31,10],
      [34,33],[35,34],[34,10],[37,36],[38,37],[37,10],
      [40,39],[41,40],[40,13],[43,42],[44,43],[43,13],
      [46,45],[47,46],[46,16],[49,48],[50,49],[49,16],
      [52,51],[53,52],[52,19],[55,54],[56,55],[55,19],
      [58,57],[59,58],[58,22],[61,60],[62,61],[61,22],
      [64,63],[65,64],[64,25],[67,66],[68,67],[67,25],
      [70,69],[71,70],[70,28],[73,72],[74,73],[73,28],
      [76,75],[77,76],[76,31],[79,78],[80,79],[79,31],
      [82,81],[83,82],[82,34],[85,84],[86,85],[85,34],
      [88,87],[89,88],[88,34],[91,90],[92,91],[92,38],
      [94,93],[95,94],[94,38],[97,96],[98,97],[97,38]
    ];

    function measureDepths(startId, adjacency) {
      const depths = new Map([[startId, 0]]);
      const queue = [startId];

      for (let index = 0; index < queue.length; index += 1) {
        const current = queue[index];

        for (const next of adjacency.get(current)) {
          if (!depths.has(next)) {
            depths.set(next, depths.get(current) + 1);
            queue.push(next);
          }
        }
      }

      return depths;
    }

    function probeImage(url) {
      return new Promise((resolve) => {
        const image = new Image();
        let timer = 0;
        let settled = false;

        const finish = (loaded) => {
          if (settled) return;

          settled = true;
          window.clearTimeout(timer);
          image.onload = null;
          image.onerror = null;
          resolve(loaded ? image : null);
        };

        timer = window.setTimeout(() => finish(false), IMAGE_TIMEOUT_MS);
        image.onload = () => finish(image.naturalWidth > 0);
        image.onerror = () => finish(false);
        image.src = url;

        if (image.complete) {
          finish(image.naturalWidth > 0);
        }
      });
    }

    function loadVis() {
      return new Promise((resolve, reject) => {
        if (typeof vis !== "undefined") {
          resolve();
          return;
        }

        const script = document.createElement("script");
        script.src = VIS_URL;
        script.async = true;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("vis-network"));
        document.head.appendChild(script);
      });
    }

    function init() {
      const root = document.getElementById("rubyGraph");
      const stage = document.getElementById("rubyGraphNetwork");

      if (!root || !stage || typeof vis === "undefined") {
        return;
      }

      const stageWrap = stage.parentElement;
      const header = root.querySelector(".ruby-graph__header");
      const depthSlider = document.getElementById("rubyGraphDepth");
      const depthOutput = document.getElementById("rubyGraphDepthValue");
      const centerButton = document.getElementById("rubyGraphCenter");
      const fullscreenButton = document.getElementById("rubyGraphFullscreen");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const adjacency = new Map(LABELS.map((_, id) => [id, []]));

      for (const [from, to] of EDGE_PAIRS) {
        adjacency.get(from).push(to);
        adjacency.get(to).push(from);
      }

      const depths = measureDepths(CENTER_ID, adjacency);
      const maxDepth = Math.max(...depths.values());

      depthSlider.max = String(maxDepth);
      depthSlider.value = String(Math.min(Number(depthSlider.value), maxDepth));

      const nodes = LABELS.map((label, id) => {
        const tone = PERL_PALETTE[id % PERL_PALETTE.length];

        return {
          id,
          label,
          borderWidth: 1.5,
          color: {
            background: tone,
            border: tone,
            highlight: { background: tone, border: "#ffffff" },
            hover: { background: tone, border: "#ffffff" }
          }
        };
      });

      const edges = EDGE_PAIRS.map(([from, to]) => {
        const child = (depths.get(from) ?? 0) >= (depths.get(to) ?? 0) ? from : to;
        const tone = PERL_PALETTE[child % PERL_PALETTE.length];

        return {
          id: `${from}:${to}`,
          from,
          to,
          width: 1.6,
          color: {
            color: tone,
            opacity: 0.7,
            highlight: "#ffffff",
            hover: tone
          }
        };
      });

      const nodeSet = new vis.DataSet();
      const edgeSet = new vis.DataSet();

      const network = new vis.Network(
        stage,
        { nodes: nodeSet, edges: edgeSet },
        {
          autoResize: false,
          nodes: {
            shape: "dot",
            size: NODE_SIZE,
            borderWidth: 1.5,
            font: NODE_FONT
          },
          edges: {
            width: 1.6,
            smooth: {
              enabled: true,
              type: "continuous"
            }
          },
          physics: {
            stabilization: {
              iterations: 150,
              fit: false
            }
          },
          interaction: {
            hover: true,
            multiselect: false
          }
        }
      );

      let centerImageUrl = "";
      let centerVAdjust = 0;
      let fitTimer = 0;
      let resizeTimer = 0;
      let fitRequested = true;
      let lastWidth = 0;
      let lastHeight = 0;
      let stabilized = false;

      function centerStyle() {
        const style = {
          shape: centerImageUrl ? "circularImage" : "dot",
          size: CENTER_SIZE,
          borderWidth: 2,
          color: {
            border: "#00ff00",
            background: "#0a0e14"
          },
          font: {
            ...NODE_FONT,
            color: "#00ff00",
            vadjust: centerVAdjust
          }
        };

        if (centerImageUrl) {
          style.image = centerImageUrl;
        }

        return style;
      }

      function fitGraph() {
        network.fit(
          reduceMotion
            ? {}
            : {
                animation: {
                  duration: 450,
                  easingFunction: "easeInOutQuad"
                }
              }
        );
      }

      function isExpanded() {
        return root.classList.contains("is-maximized") ||
          document.fullscreenElement === root;
      }

      function resizeCanvas() {
        if (isExpanded()) {
          const available = root.clientHeight - header.offsetHeight;

          if (available > 0) {
            stageWrap.style.height = `${available}px`;
          }
        } else {
          stageWrap.style.height = "";
        }

        const width = stage.clientWidth;
        const height = stage.clientHeight;

        if (width < 1 || height < 1) {
          return;
        }

        if (width === lastWidth && height === lastHeight) {
          return;
        }

        const previousWidth = lastWidth;
        const previousHeight = lastHeight;

        lastWidth = width;
        lastHeight = height;

        if (previousWidth > 0 && previousHeight > 0) {
          const position = network.getViewPosition();
          const scale = network.getScale();

          network.setSize(`${width}px`, `${height}px`);
          network.moveTo({ position, scale, animation: false });
        } else {
          network.setSize(`${width}px`, `${height}px`);
        }
      }

      function scheduleResize() {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(resizeCanvas, RESIZE_DELAY_MS);
      }

      function scheduleFit(delay) {
        window.clearTimeout(fitTimer);
        fitTimer = window.setTimeout(() => {
          resizeCanvas();
          fitGraph();
        }, typeof delay === "number" ? delay : FIT_DELAY_MS);
      }

      function finishLayout() {
        if (!fitRequested) {
          return;
        }

        fitRequested = false;
        resizeCanvas();
        fitGraph();
      }

      function applyDepth() {
        stabilized = false;

        const depth = Number(depthSlider.value);
        depthOutput.textContent = String(depth);

        const visibleNodes = nodes
          .filter((node) => (depths.get(node.id) ?? Infinity) <= depth)
          .map((node) => (
            node.id === CENTER_ID
              ? { ...node, ...centerStyle() }
              : node
          ));

        const visibleNodeIds = new Set(visibleNodes.map((node) => node.id));

        const visibleEdges = edges.filter((edge) => (
          visibleNodeIds.has(edge.from) &&
          visibleNodeIds.has(edge.to)
        ));

        fitRequested = true;
        window.clearTimeout(fitTimer);

        nodeSet.clear();
        nodeSet.add(visibleNodes);

        edgeSet.clear();
        edgeSet.add(visibleEdges);

        resizeCanvas();
      }

      network.on("stabilizationIterationsDone", () => {
        stabilized = true;
        finishLayout();
      });

      network.on("stabilized", () => {
        stabilized = true;
        finishLayout();
      });

      if (typeof IntersectionObserver === "function") {
        const visibilityObserver = new IntersectionObserver((entries) => {
          if (entries.some((entry) => entry.isIntersecting)) {
            if (!stabilized) {
              network.startSimulation();
            }
          } else {
            network.stopSimulation();
          }
        }, { rootMargin: "200px 0px" });

        visibilityObserver.observe(root);
      }

      network.on("dragStart", () => {
        fitRequested = false;
        window.clearTimeout(fitTimer);
      });

      network.on("zoom", () => {
        fitRequested = false;
        window.clearTimeout(fitTimer);
      });

      depthSlider.addEventListener("input", applyDepth);

      centerButton.addEventListener("click", () => {
        fitRequested = false;
        resizeCanvas();
        fitGraph();
      });

      if (typeof ResizeObserver === "function") {
        const stageObserver = new ResizeObserver(scheduleResize);
        stageObserver.observe(stage);
      } else {
        window.addEventListener("resize", scheduleResize);
        window.addEventListener("orientationchange", scheduleResize);
      }

      network.on("click", (params) => {
        if (params.nodes.length === 1 && params.nodes[0] === CENTER_ID) {
          window.open(CENTER_LINK_URL, "_blank", "noopener,noreferrer");
        }
      });

      network.on("hoverNode", (params) => {
        stage.style.cursor = params.node === CENTER_ID ? "pointer" : "";
      });

      network.on("blurNode", () => {
        stage.style.cursor = "";
      });

      function updateFullscreenLabel(isFullscreen) {
        const label = isFullscreen ? "Свернуть" : "На весь экран";

        fullscreenButton.title = label;
        fullscreenButton.setAttribute("aria-label", label);
        fullscreenButton.setAttribute("aria-pressed", String(isFullscreen));
      }

      function setExpanded(isOn) {
        root.classList.toggle("is-maximized", isOn);
        updateFullscreenLabel(isOn);
      }

      function toggleFullscreen() {
        const next = !isExpanded();

        if (document.fullscreenEnabled) {
          const request = document.fullscreenElement
            ? document.exitFullscreen()
            : root.requestFullscreen();

          request.catch(() => {
            setExpanded(next);
            scheduleFit();
            scheduleFit(SETTLE_DELAY_MS);
          });
        } else {
          setExpanded(next);
          scheduleFit();
          scheduleFit(SETTLE_DELAY_MS);
        }
      }

      fullscreenButton.addEventListener("click", toggleFullscreen);

      document.addEventListener("fullscreenchange", () => {
        const isFullscreen = document.fullscreenElement === root;

        setExpanded(isFullscreen);
        scheduleFit();
        scheduleFit(SETTLE_DELAY_MS);
      });

      applyDepth();
      resizeCanvas();

      probeImage(CENTER_IMAGE_URL).then((image) => {
        if (image) {
          const ratio = image.naturalHeight / image.naturalWidth;

          centerImageUrl = CENTER_IMAGE_URL;
          centerVAdjust = -CENTER_SIZE * Math.max(0, ratio - 1);
        }

        if (nodeSet.get(CENTER_ID)) {
          nodeSet.update({
            id: CENTER_ID,
            ...centerStyle()
          });

          network.redraw();
        }
      });

      if (document.fonts && typeof document.fonts.load === "function") {
        document.fonts.load("12px Inter", "голосования McDonald's")
          .then(() => network.redraw())
          .catch(() => {});
      }
    }

    function boot() {
      const root = document.getElementById("rubyGraph");

      if (!root) {
        return;
      }

      let started = false;
      let scrollTimer = 0;

      function queueStart() {
        window.clearTimeout(scrollTimer);
        scrollTimer = window.setTimeout(start, 250);
      }

      const start = () => {
        if (started) {
          return;
        }

        started = true;

        window.removeEventListener("scroll", queueStart);

        const run = () => {
          loadVis().then(init).catch(() => {});
        };

        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(run, { timeout: 1200 });
        } else {
          window.setTimeout(run, 160);
        }
      };

      if (typeof IntersectionObserver === "function") {
        const observer = new IntersectionObserver(
          (entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              observer.disconnect();
              window.addEventListener("scroll", queueStart, { passive: true });
              queueStart();
            }
          },
          { rootMargin: "300px 0px" }
        );

        observer.observe(root);
      } else {
        start();
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot, { once: true });
    } else {
      boot();
    }
  })();
</script>
